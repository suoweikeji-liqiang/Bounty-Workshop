services:
  # Bounty 专属的文件存储服务
  minio:
    # 🌟 优化：复用您机器上原有的长亭镜像，避免重新从墙外下载
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    container_name: bounty-minio
    restart: unless-stopped
    command: minio server /data --console-address ":9001"
    ports:
      - "8001:9001"
    environment:
      - MINIO_ROOT_USER=bounty_admin
      - MINIO_ROOT_PASSWORD=bounty_password
    volumes:
      - ./data/minio:/data
    networks:
      bounty-net:
        ipv4_address: "169.254.16.20"

  # 自动建桶的临时助手工具
  minio-init:
    # 🌟 优化：加上国内可访问的镜像加速前缀
    image: docker.m.daocloud.io/minio/mc:latest
    container_name: bounty-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 bounty_admin bounty_password;
      mc mb myminio/bounty-workshop --ignore-existing;
      mc policy set public myminio/bounty-workshop;
      exit 0;
      "
    networks:
      bounty-net:
        ipv4_address: "169.254.16.21"

  # 后端 API 服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bounty-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - minio
    environment:
      - APP_DB_PATH=/app/data/app.db
      - AUTH_TOKEN_SECRET=change-this-to-a-strong-random-secret
      - AUTH_TOKEN_TTL_MINUTES=1440
      - ENABLE_BACKGROUND_JOBS=true
      - ENABLE_FEISHU_SYNC_JOB=true
      - RATE_LIMIT_ENABLED=true
      - CORS_ALLOW_ORIGINS=*
      - FEISHU_PROVIDER=mock
      
      # ==== 自动对接自带的 MinIO ====
      - ATTACHMENT_STORAGE_BACKEND=s3
      - ATTACHMENT_S3_BUCKET=bounty-workshop
      - ATTACHMENT_S3_ENDPOINT_URL=http://minio:9000
      - ATTACHMENT_S3_REGION=us-east-1
      - ATTACHMENT_S3_ACCESS_KEY_ID=bounty_admin
      - ATTACHMENT_S3_SECRET_ACCESS_KEY=bounty_password
    networks:
      bounty-net:
        ipv4_address: "169.254.16.22"

  # 前端 Web 服务 (Nginx)
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: bounty-frontend
    restart: unless-stopped
    ports:
      - "81:80"  # 将主机的 81 端口映射到容器的 80
    depends_on:
      - backend
    networks:
      bounty-net:
        ipv4_address: "169.254.16.23"

# 🌟 优化：采用独立网段分配，避免默认网桥在 NAS 上冲突
networks:
  bounty-net:
    ipam:
      driver: default
      config:
        - subnet: "169.254.16.0/24"
